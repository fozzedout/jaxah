<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store</title>
<!--
  Store: the catalogue (manifest.json) against what is installed (install
  records in this browser's localStorage). Install / uninstall / export /
  import all go through the bridge (capability "store") and land in the
  Trail. Runs from its own install record, like every code app.
-->
<style>
:root { --bg:#0a1418; --panel:#0f1f25; --line:rgba(255,255,255,.12); --ink:#e8f1f0; --dim:#9fb8b4; --faint:#6f8783; --teal:#5eead4; --red:#fca5a5; }
html[data-theme="light"] { --bg:#f4faf9; --panel:#e6f0ee; --line:rgba(10,40,40,.16); --ink:#102a28; --dim:#3f5f5b; --faint:#6b8a86; --teal:#0f766e; --red:#b91c1c; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, textarea { font: inherit; color: inherit; }
header { position: sticky; top: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0 auto 0 0; }
.btn { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.btn:hover { background: rgba(94,234,212,.1); }
.btn.warn { color: var(--red); }
#msg { padding: 6px 12px; font-size: 13px; color: var(--dim); white-space: pre-wrap; }
#msg.err { color: var(--red); }
#imp { padding: 0 12px 10px; }
#imp textarea { width: 100%; min-height: 90px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; font: 12px ui-monospace, Menlo, monospace; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 14px 12px 4px; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: 34px 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
li .i { font-size: 20px; text-align: center; }
li .n b { font-weight: 600; }
li .n small { display: block; color: var(--faint); font-size: 12px; }
li .d { grid-column: 2 / -1; color: var(--dim); font-size: 12px; }
.tag { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; margin-left: 4px; color: var(--dim); }
.tag.on { color: var(--teal); border-color: var(--teal); }
</style>
</head>
<body>
<header>
  <h1>Store</h1>
  <button class="btn" id="export" type="button" title="Download every installed app (code included) as one JSON file">Export bundle</button>
  <button class="btn" id="importbtn" type="button">Import bundle…</button>
</header>
<div id="imp" hidden>
  <p style="margin:6px 0;color:var(--dim);font-size:13px">Choose an <code>airis.bundle/1</code> file, or paste its JSON.</p>
  <input type="file" id="file" accept="application/json,.json">
  <textarea id="paste" spellcheck="false" placeholder='{"schema":"airis.bundle/1","records":[...]}'></textarea>
  <button class="btn" id="doimport" type="button">Install from bundle</button>
</div>
<div id="msg" role="status" aria-live="polite"></div>
<h2>Catalogue</h2>
<ul id="cat"></ul>
<h2 id="xh" hidden>Imported / not in catalogue</h2>
<ul id="extra"></ul>
<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
var seq = 0, pending = {};
window.addEventListener('message', function (e) {
  if (e.source !== window.parent) return;
  var m = e.data;
  if (!m || m.airis !== 1) return;
  if (m.event === 'theme') { document.documentElement.setAttribute('data-theme', m.theme); return; }
  var p = pending[m.re]; if (!p || Object.prototype.hasOwnProperty.call(m, 'chunk')) return;
  delete pending[m.re];
  m.ok ? p.resolve(m.value) : p.reject(new Error(m.error));
});
function call(op, args) {
  return new Promise(function (resolve, reject) {
    var id = ++seq; pending[id] = { resolve: resolve, reject: reject };
    window.parent.postMessage({ airis: 1, id: id, op: op, args: args || {} }, '*');
  });
}
function say(t, err) { var m = $('msg'); m.textContent = t; m.className = err ? 'err' : ''; }
function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function row(a) {
  var li = el('li');
  li.appendChild(el('span', 'i', a.icon || '▢'));
  var n = el('span', 'n'); var b = el('b', null, a.name); n.appendChild(b);
  if (a.installed) n.appendChild(el('span', 'tag on', a.source === 'import' ? 'imported' : 'installed'));
  if (a.installed && a.installedVersion !== a.version && a.source === 'catalogue') n.appendChild(el('span', 'tag', 'update ' + a.installedVersion + ' → ' + a.version));
  if (a.orphan) n.appendChild(el('span', 'tag', 'gone from catalogue'));
  n.appendChild(el('small', null, a.id + ' · v' + a.version + ' · ' + (a.install === 'code' ? 'code stored in browser' : 'link') +
    (a.launch === 'standalone' ? ' · opens in a tab' : '') + (a.capabilities.length ? ' · can use: ' + a.capabilities.join(', ') : '') + (a.hidden ? ' · hidden tile' : '')));
  li.appendChild(n);
  var btn = el('button', 'btn' + (a.installed ? ' warn' : ''), a.installed ? 'Uninstall' : 'Install');
  btn.type = 'button';
  btn.addEventListener('click', function () {
    btn.disabled = true;
    call(a.installed ? 'store.uninstall' : 'store.install', { id: a.id })
      .then(function () { say((a.installed ? 'Uninstalled ' : 'Installed ') + a.name + '.'); return refresh(); },
            function (e) { say(e.message, true); btn.disabled = false; });
  });
  li.appendChild(btn);
  if (a.description) li.appendChild(el('span', 'd', a.description));
  return li;
}
function refresh() {
  return call('store.list').then(function (l) {
    var c = $('cat'), x = $('extra'); c.textContent = ''; x.textContent = '';
    l.catalogue.forEach(function (a) { c.appendChild(row(a)); });
    l.extra.forEach(function (a) { x.appendChild(row(a)); });
    $('xh').hidden = !l.extra.length;
  }).catch(function (e) { say('Store could not reach the shell: ' + e.message, true); });
}
$('export').addEventListener('click', function () {
  call('store.export').then(function (r) { say('Downloaded ' + r.file + ' — ' + r.count + ' apps, ' + Math.round(r.bytes / 1024) + ' KB. Keys and app data are not included.'); },
    function (e) { say(e.message, true); });
});
$('importbtn').addEventListener('click', function () { $('imp').hidden = !$('imp').hidden; });
$('file').addEventListener('change', function () {
  var f = this.files && this.files[0]; if (!f) return;
  f.text().then(function (t) { $('paste').value = t; });
});
$('doimport').addEventListener('click', function () {
  var t = $('paste').value.trim(); if (!t) { say('Nothing to import.', true); return; }
  call('store.import', { text: t }).then(function (r) {
    say('Imported: ' + (r.imported.join(', ') || 'nothing') + (r.unchanged && r.unchanged.length ? '\nAlready installed, unchanged: ' + r.unchanged.length : '') + (r.skipped.length ? '\nSkipped: ' + r.skipped.map(function (s) { return (s.id || '?') + ' (' + s.reason + ')'; }).join('; ') : ''));
    $('paste').value = ''; $('imp').hidden = true;
    return refresh();
  }, function (e) { say(e.message, true); });
});
if (window.parent === window) { say('Store runs inside Airis OS: open /#app/store.', true); return; }
call('hello').then(function (h) { document.documentElement.setAttribute('data-theme', h.theme === 'light' ? 'light' : 'dark'); return refresh(); },
  function (e) { say(e.message, true); });
})();
</script>
</body>
</html>
