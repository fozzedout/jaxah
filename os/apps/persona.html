<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona — Airis OS</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #123b3f 0%, #0b1e24 55%, #070d12 100%);
    color: #e8f1f0;
  }
  .card {
    width: 100%; max-width: 560px; border-radius: 18px; padding: 24px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 20px 60px rgba(0,0,0,.45); backdrop-filter: blur(8px);
  }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .3px; }
  .sub { margin: 0 0 14px; color: #9fb8b4; font-size: 13px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
    color: #8ef0e2; background: rgba(94,234,212,.1); border: 1px solid rgba(94,234,212,.3);
    padding: 6px 12px; border-radius: 999px; margin-bottom: 16px;
  }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: #5eead4;
    box-shadow: 0 0 10px #5eead4; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
  label { display: block; font-size: 13px; color: #9fb8b4; margin: 0 0 6px; }
  .row { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; min-width: 0; padding: 12px 14px; font-size: 16px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.35); color: inherit;
  }
  input[type="text"]:focus { outline: 2px solid #5eead4; outline-offset: 1px; }
  button {
    padding: 12px 16px; font-size: 15px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.16); background: #134e4a; color: #ecfdf5; min-height: 48px;
  }
  button:hover { background: #0f766e; }
  button.ghost { background: transparent; }
  .answer {
    margin-top: 16px; padding: 16px; border-radius: 12px; font-size: 18px; line-height: 1.5;
    background: rgba(0,0,0,.35); border-left: 3px solid #5eead4; min-height: 60px;
  }
  .hint { margin-top: 12px; font-size: 12px; color: #7d9490; }
  .controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  @media (max-width: 480px) { .row { flex-direction: column; } }
  @media (prefers-reduced-motion: reduce) { .status i { animation: none; } }
</style>
</head>
<body>
  <main class="card">
    <h1>Airis</h1>
    <p class="sub">Persona · scripted presence.</p>
    <div class="status"><i></i><span>I'm scripted, not live.</span></div>

    <label for="q">Say something — the answer never changes:</label>
    <div class="row">
      <input id="q" type="text" placeholder="e.g. what is the meaning of life?" autocomplete="off">
      <button id="ask" type="button">Ask</button>
    </div>

    <div class="answer" id="answer" aria-live="polite">I'm scripted, not live.</div>

    <div class="controls">
      <button id="speak" type="button">🔊 Speak the line</button>
      <button id="stop" type="button" class="ghost">Stop</button>
    </div>

    <!-- Recorded offline with eSpeak NG (en-gb+f3), saying exactly the
         displayed line. One static clip; no runtime speech service. -->
    <audio id="clip" preload="metadata" src="../assets/airis-scripted.mp3"></audio>

    <p class="hint" id="audio-status" role="status">Speak plays a canned recording of the displayed line.</p>
  </main>

<script>
(function () {
  "use strict";
  var LINE = "I'm scripted, not live.";
  var q = document.getElementById('q');
  var answer = document.getElementById('answer');
  var clip = document.getElementById('clip');
  var audioStatus = document.getElementById('audio-status');

  // AGENT-INTERFACE HOOK: a real agent would plug in here. Replace the body
  // of scriptedReply() with a call to the agent (postMessage bridge, fetch,
  // etc.) and render its reply. The status line above must then change to
  // reflect live state — never claim "live" while this stub is in place.
  function scriptedReply() { return LINE; }

  function ask() {
    // NOTE: intentionally ignores the input — the ONLY answer this app can
    // ever give to anything is the line below.
    answer.textContent = scriptedReply();
    speak();
  }

  function speak() {
    answer.textContent = LINE;
    clip.pause();
    clip.currentTime = 0;
    audioStatus.textContent = 'Playing the canned recording…';
    var playback = clip.play();
    if (playback && playback.catch) playback.catch(function (error) {
      if (error.name !== 'AbortError') audioStatus.textContent = 'Audio could not play. Press Speak to retry.';
    });
  }

  function stop() {
    clip.pause();
    clip.currentTime = 0;
    audioStatus.textContent = 'Stopped. Press Speak to replay.';
  }
  clip.addEventListener('ended', function () { audioStatus.textContent = 'Finished. Press Speak to replay.'; });
  clip.addEventListener('error', function () { audioStatus.textContent = 'The canned recording could not load.'; });

  document.getElementById('ask').addEventListener('click', ask);
  document.getElementById('speak').addEventListener('click', speak);
  document.getElementById('stop').addEventListener('click', stop);
  q.addEventListener('keydown', function (e) { if (e.key === 'Enter') ask(); });
})();
</script>
</body>
</html>
