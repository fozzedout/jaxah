body { background: #100e13; }

#result, #click-result, #ask-result { min-height: 1.45em; }
#say { color: #f0d0a4; }
#form { position: absolute; left: 14px; right: 14px; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 7px; pointer-events: auto; }
#command { min-width: 0; flex: 1; height: 48px; padding: 0 14px; border: 1px solid #9d765b88; border-radius: 12px; background: #191419e8; color: #fff1dc; font-size: 16px; }
#send, #reset, #pad button { border: 1px solid #9d765b88; border-radius: 12px; background: #392a27; color: #f2dfca; }
#send, #reset { font: 13px inherit; padding: 0 15px; min-height: 48px; }
#pad { position: absolute; right: 14px; bottom: calc(78px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(3,48px); grid-template-rows: repeat(2,48px); gap: 3px; pointer-events: auto; }
#pad button { font-size: 20px; touch-action: none; }
#pad button:nth-child(1) { grid-column: 2; }
#pad button:nth-child(2) { grid-column: 1; grid-row: 2; }
#pad button:nth-child(3) { grid-column: 2; grid-row: 2; }
#pad button:nth-child(4) { grid-column: 3; grid-row: 2; }

      askResult.textContent = `ask: asked, brought in ${((performance.now() - busy.started) / 1000).toFixed(1)}s`;
      busy.phase = 'done';
    }
  }
  if (busy.phase === 'done') busy = null;
}
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(.05, (now - previous) / 1000);
  previous = now;
  avgMs = avgMs * .94 + dt * 1000 * .06;
  if (avgMs > 22) { slowFrames++; recoverySince = 0; }
  else {
    slowFrames = Math.max(0, slowFrames - 1);
    if (quality > 0 && avgMs < 14) {
      if (!recoverySince) recoverySince = now;
      if (now - recoverySince > 5000) { quality--; recoverySince = now; resize(); }
    } else recoverySince = 0;
  }
  if (slowFrames > 100 && quality < 2) { quality++; slowFrames = 0; resize(); }
  updateTask(dt, now);
  const walking = !!busy && (busy.phase === 'walkOut' || busy.phase === 'walkBack' || busy.kind === 'walk');
  const leanTarget = walking ? .08 : 0;
  airis.rotation.x += (leanTarget - airis.rotation.x) * Math.min(1, dt * 4);
  airis.position.y = walking ? .018 * Math.sin(stride * 2) : 0;
  if (now > blinkAt) blinkUntil = now + 120;
  const blinkScale = now < blinkUntil ? .03 : 1;
  for (const eye of eyes) eye.scale.y = blinkScale;
  if (now >= blinkUntil && blinkAt < now) blinkAt = now + 3000 + Math.random() * 3000;
  const toward = Math.atan2(pos.x - airis.position.x, pos.z - airis.position.z);
  const delta = Math.atan2(Math.sin(toward - yaw), Math.cos(toward - yaw));
  if (Math.abs(delta) < .21) {
    if (!gazeSince) { gazeSince = now; gazeYaw = toward; }
    if (now - gazeSince >= 500) {
      const headTarget = THREE.MathUtils.clamp(Math.atan2(Math.sin(gazeYaw - airis.rotation.y), Math.cos(gazeYaw - airis.rotation.y)), -Math.PI / 3, Math.PI / 3);
      headPivot.rotation.y += (headTarget - headPivot.rotation.y) * Math.min(1, dt * 5);
      if (!busy) airis.rotation.y += Math.atan2(Math.sin(gazeYaw - airis.rotation.y), Math.cos(gazeYaw - airis.rotation.y)) * Math.min(1, dt * 1.6);
    }
  } else { gazeSince = 0; headPivot.rotation.y *= Math.max(0, 1 - dt * 3); }
  if (carried) carriedGlow.position.set(.38, .86, .12);
  camera.position.copy(pos);
  camera.rotation.order = 'YXZ';
  camera.rotation.set(pitch, yaw, 0);
  renderer.render(scene, camera);
}
window.__house = {
  get avgMs() { return avgMs; },
  get dpr() { return renderer.getPixelRatio(); },
  get shadows() { return renderer.shadowMap.enabled; },
  get quality() { return quality; },
  cmd: startTask,
  task: () => busy?.phase || (busy?.kind === 'walk' ? 'walk' : null),
  airis: { get x() { return airis.position.x; }, get z() { return airis.position.z; } },
  project(name) {
    const object = items[name];
    if (!object) return null;
    const point = object.getWorldPosition(new THREE.Vector3()).project(camera);
    return { x: (point.x + 1) * stage.clientWidth / 2, y: (1 - point.y) * stage.clientHeight / 2 };
  },
};
requestAnimationFrame(animate);
</script>
