</div>

<script type="module">

const stage = document.querySelector('#stage');
const canvas = document.querySelector('#gl');
const say = document.querySelector('#say');
const clickResult = document.querySelector('#click-result');

const form = document.querySelector('#form');
const input = document.querySelector('#command');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17141a);

const camera = new THREE.PerspectiveCamera(68, 1, .05, 40);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (error) {
  document.body.innerHTML = '<p style="font:16px system-ui;color:#eee;padding:24px">WebGL is not available on this device.</p>';

scene.add(new THREE.HemisphereLight(0xf6d8ad, 0x211b2b, 1.15));
scene.add(new THREE.AmbientLight(0x82738a, .25));

const material = (color, roughness = .9, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, ...extra });
const wallMat = material(0x9b7764);
const floorMat = material(0x62432f);
const wood = material(0x573923);
const woodTop = material(0x795538);
const metal = material(0x252128, .6);
const plum = material(0x382239, .85, { emissive: 0x100814, emissiveIntensity: .08 });
const ember = material(0xffa866, .5, { emissive: 0xd15b1a, emissiveIntensity: .65 });

// --- the room is an octagon -------------------------------------------------
// Eight flat faces. Squared up to one face, the two beside it stay in view at the
// edges: a wall to work on, plus a bit to the left and a bit to the right.
const FACE_COUNT = 8;
const FACE_WIDTH = 2.7;                                                 // each face, wide enough for the wall note
const ROOM_RADIUS = .5 * FACE_WIDTH / Math.sin(Math.PI / FACE_COUNT);   // centre to corner
const APOTHEM = .5 * FACE_WIDTH / Math.tan(Math.PI / FACE_COUNT);       // centre to face
const WALL_HEIGHT = 2.8, WALL_THICK = .16;

  mesh.rotation.y = faceYaw(k);

  return mesh;

// A soft ceiling fill keeps all eight faces lit; the lamp still warms one side.
const ceilingLight = new THREE.PointLight(0xffb277, 14, 10, 2);
ceilingLight.position.set(0, WALL_HEIGHT - .35, 0);
scene.add(ceilingLight);

// Night window on the right-front face.
const night = material(0x07132d, .7, { emissive: 0x07132d, emissiveIntensity: .7 });

const starGeo = new THREE.SphereGeometry(.015, 6, 5);
const starMat = new THREE.MeshBasicMaterial({ color: 0xa9c9ff });

onFace(4, new THREE.Mesh(new THREE.BoxGeometry(1.16, 2.6, .1), woodTop), 0, 1.3, .02);
onFace(4, new THREE.Mesh(new THREE.BoxGeometry(1.02, 2.48, .06), wood), 0, 1.24, .05);

  material(0x151119, .95, { emissive: 0x0d0a12, emissiveIntensity: .45 })), 0, NOTE_Y, .045);

skirt.scale.z = .72;
airis.add(skirt);

torso.position.y = 1.12;
airis.add(torso);
const headPivot = group(airis, 0, 1.48, 0);
const head = new THREE.Mesh(new THREE.SphereGeometry(.17, 16, 12), ember);

head.scale.set(.85, 1.05, .8);
headPivot.add(head);
const eyes = [];
for (const x of [-.055, .055]) {
  const eye = new THREE.Mesh(new THREE.BoxGeometry(.035, .009, .012), material(0x241821, .5, { emissive: 0x3c1c1b }));

  const arm = new THREE.Mesh(new THREE.CapsuleGeometry(.065, .43, 3, 6), material(0x493044));
  arm.position.set(x * .27, 1.02, 0);
  arm.rotation.z = x * -.12;
  airis.add(arm);
}
const handGlow = new THREE.PointLight(0xffa45f, 1.2, 1.6);
handGlow.position.set(.38, .86, .12);
airis.add(handGlow);
const rimLight = new THREE.PointLight(0xffa875, .65, 2.5);
rimLight.position.set(-.35, 1.8, -.35);
airis.add(rimLight);

  item(name) { const o = items[name]; if (!o) return null; o.updateWorldMatrix(true, true); const b = new THREE.Box3().setFromObject(o); return { minY: b.min.y, maxY: b.max.y, minX: b.min.x, maxX: b.max.x, minZ: b.min.z, maxZ: b.max.z, visible: o.visible }; },
  task: () => busy?.phase || (busy?.kind === 'walk' ? 'walk' : null),
  airis: { get x() { return airis.position.x; }, get z() { return airis.position.z; } },
  seat: () => ({
    face: state.face, lateral: state.seats[state.face].lateral, depth: state.seats[state.face].depth,
    pan: state.pan, homeDepth: HOME_DEPTH, eye: EYE_HEIGHT,
  }),
  cameraState: () => ({
    x: pos.x, y: pos.y, z: pos.z, yaw, pitch, fov: camera.fov, aspect: camera.aspect,
    horizontalFov: 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect) * 180 / Math.PI,
  }),
  nudge: nudgeSeat,
  setFace,
  note: { get text() { return state.note; }, get shown() { return noteShown; } },
  room: { faces: FACE_COUNT, faceWidth: FACE_WIDTH, apothem: APOTHEM, wallHeight: WALL_HEIGHT },
  project(name) {
    const object = items[name];
    if (!object) return null;
    const point = object.getWorldPosition(new THREE.Vector3()).project(camera);
    return { x: (point.x + 1) * stage.clientWidth / 2, y: (1 - point.y) * stage.clientHeight / 2 };
  },
};
requestAnimationFrame(animate);
</script>
