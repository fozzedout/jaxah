  const path = routeTo(waypoints[name], name);
  const back = name === 'book' ? [waypoints.doorway.clone(), waypoints.doorOutside.clone()] : [];
  back.push(...route(back.length ? back[back.length - 1] : waypoints[name], waypoints.desk));
  replaceTask({ kind: 'bring', name, item, phase: 'walkOut', path, returnPath: back, pause: 0 });
  askResult.textContent = 'ask: in progress';
}
const targets = { window: new THREE.Vector3(-1.4, 0, -2.2), door: waypoints.doorOutside, desk: waypoints.desk, lamp: new THREE.Vector3(1.75, 0, .7), here: new THREE.Vector3(0, 0, 1.25) };
function startTask(text) {
  const query = text.trim().toLowerCase();
  say.textContent = '';
  if (!query) return;
  if (/^(reset|put it back)$/.test(query)) { resetObjects(); return; }
  if (/\b(bring|fetch|get|grab|give me)\b/.test(query)) {
    const item = /book|notebook|journal|diary/.test(query) ? 'book' : /wall thing|frame|picture|clock/.test(query) ? 'wall' : null;
    if (!item) { say.textContent = "I don't know what that is."; return; }
    taskBring(item);
    return;
  }
  if (/\b(go|walk|stand|move)\b/.test(query)) {
    const dest = /window/.test(query) ? 'window' : /door/.test(query) ? 'door' : /desk/.test(query) ? 'desk' : /lamp/.test(query) ? 'lamp' : /here|me/.test(query) ? 'here' : null;
    if (!dest) { say.textContent = "I don't know where you mean."; return; }
    replaceTask({ kind: 'walk', path: route(airis.position, targets[dest]), face: true });
    return;
  }
  say.textContent = "I don't know what you mean.";
}
function resetObjects() {
  items.book.position.copy(itemHomes.book);
  items.wall.position.copy(itemHomes.wall);
  for (const item of Object.values(items)) item.visible = true;
  carried = null;
  carriedGlow.visible = false;
  busy = null;
  clickResult.textContent = '';
  askResult.textContent = '';
  say.textContent = '';
}
form.addEventListener('submit', event => { event.preventDefault(); startTask(input.value); input.value = ''; });
document.querySelector('#reset').addEventListener('click', resetObjects);

let quality = 0, avgMs = 0, slowFrames = 0, recoverySince = 0, framed = false;
function resize() {
  const width = stage.clientWidth, height = stage.clientHeight;
  if (!width || !height) return;
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1) * (quality === 1 ? .85 : quality >= 2 ? .65 : 1));
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  // Portrait keeps at least ~60deg across, so the room reads as a room on a phone.
  const minHorizontal = THREE.MathUtils.degToRad(60);
  camera.fov = THREE.MathUtils.clamp(THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(minHorizontal / 2) / camera.aspect)), 68, 100);
  camera.updateProjectionMatrix();
  // First frame only: a tall screen tilts down so the floor, not the ceiling, fills the extra height.
  if (!framed) { pitch = camera.aspect < 1 ? -.34 : -.12; framed = true; }
}
new ResizeObserver(resize).observe(stage);
window.addEventListener('orientationchange', resize);
resize();

const walkPad = document.querySelector('#walk-pad');
const heldDirections = new Set();
const keyDirections = new Map([['w', 'up'], ['ArrowUp', 'up'], ['s', 'down'], ['ArrowDown', 'down'], ['a', 'left'], ['ArrowLeft', 'left'], ['d', 'right'], ['ArrowRight', 'right']]);
function setDirection(direction, held) {
  if (held) heldDirections.add(direction); else heldDirections.delete(direction);
  const button = walkPad.querySelector(`[data-dir="${direction}"]`);
  button?.setAttribute('aria-pressed', String(heldDirections.has(direction)));
}
walkPad.querySelectorAll('button').forEach(button => {
  const direction = button.dataset.dir;
  button.addEventListener('pointerdown', event => { event.preventDefault(); button.setPointerCapture(event.pointerId); setDirection(direction, true); });
  const release = event => { if (button.hasPointerCapture(event.pointerId)) button.releasePointerCapture(event.pointerId); setDirection(direction, false); };
  button.addEventListener('pointerup', release);
  button.addEventListener('pointercancel', release);
  button.addEventListener('lostpointercapture', () => setDirection(direction, false));
});
window.addEventListener('keydown', event => {
  const direction = keyDirections.get(event.key);
  if (!direction || event.target instanceof HTMLElement && /^(INPUT|TEXTAREA|BUTTON)$/.test(event.target.tagName)) return;
  event.preventDefault(); setDirection(direction, true);
});
window.addEventListener('keyup', event => { const direction = keyDirections.get(event.key); if (direction) setDirection(direction, false); });
window.addEventListener('blur', () => { for (const direction of [...heldDirections]) setDirection(direction, false); });
function moveCamera(dt) {
  if (!heldDirections.size || busy) return;
  const forward = Number(heldDirections.has('up')) - Number(heldDirections.has('down'));
  const sideways = Number(heldDirections.has('right')) - Number(heldDirections.has('left'));
  if (!forward && !sideways) return;
  const length = Math.hypot(forward, sideways), speed = 1.8 * dt / length;
  const dx = (-Math.sin(yaw) * forward + Math.cos(yaw) * sideways) * speed;
  const dz = (-Math.cos(yaw) * forward - Math.sin(yaw) * sideways) * speed;
  const current = { x: pos.x, z: pos.z };
  const blocked = (x, z) => obstacles.some(o => segmentHits(o, current, { x, z }));
  let x = THREE.MathUtils.clamp(pos.x + dx, -2.68, 2.68), z = THREE.MathUtils.clamp(pos.z + dz, -2.68, 2.68);
  if (!blocked(x, z)) pos.set(x, 1.6, z);
  else {
    x = THREE.MathUtils.clamp(pos.x + dx, -2.68, 2.68);
    if (!blocked(x, pos.z)) pos.x = x;
    z = THREE.MathUtils.clamp(pos.z + dz, -2.68, 2.68);
    if (!blocked(pos.x, z)) pos.z = z;
    pos.y = 1.6;
  }
  if (Math.hypot(pos.x - current.x, pos.z - current.z) > .0001) hideWalkHint();
}
let previous = performance.now();
let blinkAt = previous + 3000 + Math.random() * 3000;
let blinkUntil = 0;
let stride = 0;
function walkToward(point, dt) {
  const dx = point.x - airis.position.x, dz = point.z - airis.position.z;
  const distance = Math.hypot(dx, dz);
  if (distance < .055) return true;
  const step = Math.min(distance, 1.05 * dt);
  airis.position.x += dx / distance * step;
  airis.position.z += dz / distance * step;
  airis.rotation.y = Math.atan2(dx, dz);
  stride += step * 11;
  return false;
}
function updateTask(dt, now) {
  if (!busy) return;
  if (busy.kind === 'click') {
    busy.elapsed += dt;
    const t = Math.min(1, busy.elapsed / .4);
    busy.item.visible = true;
    busy.item.position.lerpVectors(busy.item.position, busy.target, Math.min(1, dt * 2));
    busy.item.position.y = busy.target.y + Math.sin(Math.PI * t) * .45;
    if (t >= 1) {
      busy.item.position.copy(busy.target);
      busy.item.visible = true;
      traceEvent('click-setdown', busy.item);
      clickResult.textContent = `click: fetched by hand, ${((performance.now() - clickStart) / 1000).toFixed(1)}s`;
      busy = null;
    }
    return;
  }
  if (busy.phase === 'pickupPause' || busy.phase === 'setDownPause') {
    busy.pause += dt;
    const duration = busy.phase === 'pickupPause' ? .4 : .3;
    if (busy.pause < duration) return;
    if (busy.phase === 'pickupPause') {
      traceEvent('bring-pickup', busy.item);
      busy.item.visible = false;
      carried = busy.item;
      carriedGlow.visible = true;
      busy.phase = 'walkBack';
      busy.path = busy.returnPath;
      busy.index = 0;
    } else {
      setDownCarried();
      busy.phase = 'faceCamera';
    }
  }
  if (busy.phase === 'walkOut' || busy.phase === 'walkBack' || busy.kind === 'walk') {
    const point = busy.path[busy.index];
    if (!point || walkToward(point, dt)) {
      if (point) busy.index++;
      if (busy.index >= busy.path.length) {
        if (busy.kind === 'walk') { busy = null; return; }
        if (busy.phase === 'walkOut') { busy.phase = 'pickupPause'; busy.pause = 0; }
        else if (busy.phase === 'walkBack') { busy.phase = 'setDownPause'; busy.pause = 0; }
      }
    }
    return;
  }
  if (busy.phase === 'faceCamera') {
    const target = Math.atan2(pos.x - airis.position.x, pos.z - airis.position.z);
    const delta = Math.atan2(Math.sin(target - airis.rotation.y), Math.cos(target - airis.rotation.y));
    airis.rotation.y += delta * Math.min(1, dt * 4);
    if (Math.abs(delta) < .04) {
      askResult.textContent = `ask: asked, brought in ${((performance.now() - busy.started) / 1000).toFixed(1)}s`;
      busy.phase = 'done';
    }
  }
  if (busy.phase === 'done') busy = null;
}
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(.05, (now - previous) / 1000);
  previous = now;
  avgMs = avgMs * .94 + dt * 1000 * .06;
  if (avgMs > 22) { slowFrames++; recoverySince = 0; }
  else {
    slowFrames = Math.max(0, slowFrames - 1);
    if (quality > 0 && avgMs < 14) {
      if (!recoverySince) recoverySince = now;
      if (now - recoverySince > 5000) { quality--; recoverySince = now; resize(); }
    } else recoverySince = 0;
  }
  if (slowFrames > 100 && quality < 2) { quality++; slowFrames = 0; resize(); }
  updateTask(dt, now);
  moveCamera(dt);
  const walking = !!busy && (busy.phase === 'walkOut' || busy.phase === 'walkBack' || busy.kind === 'walk');
  const leanTarget = walking ? .08 : 0;
  airis.rotation.x += (leanTarget - airis.rotation.x) * Math.min(1, dt * 4);
  airis.position.y = walking ? .018 * Math.sin(stride * 2) : 0;
  if (now > blinkAt) blinkUntil = now + 120;
  const blinkScale = now < blinkUntil ? .03 : 1;
  for (const eye of eyes) eye.scale.y = blinkScale;
  if (now >= blinkUntil && blinkAt < now) blinkAt = now + 3000 + Math.random() * 3000;
  const toward = Math.atan2(pos.x - airis.position.x, pos.z - airis.position.z);
  const delta = Math.atan2(Math.sin(toward - yaw), Math.cos(toward - yaw));
  if (Math.abs(delta) < .21) {
    if (!gazeSince) { gazeSince = now; gazeYaw = toward; }
    if (now - gazeSince >= 500) {
      const headTarget = THREE.MathUtils.clamp(Math.atan2(Math.sin(gazeYaw - airis.rotation.y), Math.cos(gazeYaw - airis.rotation.y)), -Math.PI / 3, Math.PI / 3);
      headPivot.rotation.y += (headTarget - headPivot.rotation.y) * Math.min(1, dt * 5);
      if (!busy) airis.rotation.y += Math.atan2(Math.sin(gazeYaw - airis.rotation.y), Math.cos(gazeYaw - airis.rotation.y)) * Math.min(1, dt * 1.6);
    }
  } else { gazeSince = 0; headPivot.rotation.y *= Math.max(0, 1 - dt * 3); }
  if (carried) carriedGlow.position.set(.38, .86, .12);
  camera.position.copy(pos);
  if (debugEnabled) cameraDebug.textContent = `camera x ${pos.x.toFixed(2)} · z ${pos.z.toFixed(2)}`;
  camera.rotation.order = 'YXZ';
  camera.rotation.set(pitch, yaw, 0);
  renderer.render(scene, camera);
}
window.__house = {
  get avgMs() { return avgMs; },
  get dpr() { return renderer.getPixelRatio(); },
  get shadows() { return renderer.shadowMap.enabled; },
  get quality() { return quality; },
  cmd: startTask,
  trace,
  obstacles: obstacles.map(({ name, x1, x2, z1, z2 }) => ({ name, x1, x2, z1, z2 })),
  item(name) { const o = items[name]; if (!o) return null; o.updateWorldMatrix(true, true); const b = new THREE.Box3().setFromObject(o); return { minY: b.min.y, maxY: b.max.y, minX: b.min.x, maxX: b.max.x, minZ: b.min.z, maxZ: b.max.z, visible: o.visible }; },
  task: () => busy?.phase || (busy?.kind === 'walk' ? 'walk' : null),
  airis: { get x() { return airis.position.x; }, get z() { return airis.position.z; } },
  project(name) {
    const object = items[name];
    if (!object) return null;
    const point = object.getWorldPosition(new THREE.Vector3()).project(camera);
    return { x: (point.x + 1) * stage.clientWidth / 2, y: (1 - point.y) * stage.clientHeight / 2 };
  },
};
requestAnimationFrame(animate);
</script>
